# 每日更新看盤：抓新資料 → 重新訓練模型 → 產生網頁 → 發佈到 GitHub Pages
# 不需要你的電腦開著。資料庫 market.db 存在 data 分支（只保留最新一份，不會越長越大）。
name: 每日更新看盤

on:
  schedule:
    - cron: "30 8 * * 1-5"    # 台灣時間 週一～五 16:30（台股收盤、三大法人公布後）
    - cron: "30 22 * * 1-5"   # 台灣時間 週二～六 06:30（美股收盤後）
  workflow_dispatch:           # 可在 Actions 頁面按「Run workflow」立即更新
  push:
    branches: [main]
    paths: ["config.json"]     # 修改自選股清單後自動更新

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: 安裝套件
        run: pip install -r requirements-cloud.txt

      - name: 取回昨天的資料庫
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            git checkout FETCH_HEAD -- market.db.gz 2>/dev/null && gunzip -f market.db.gz || true
            git checkout FETCH_HEAD -- market.db 2>/dev/null || true
            git checkout FETCH_HEAD -- calib.json 2>/dev/null || true
            git reset -q
            ls -la market.db 2>/dev/null || true
            ls -la market.db 2>/dev/null || true
          else
            echo "第一次執行：建立新資料庫（每檔約 10～30 秒）"
          fi

      - name: 更新資料與重新訓練模型
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          MAX_MINUTES: "240"           # 自選股優先；排行榜股票池超過時間的留到下一次（最久沒更新的先做）
        run: python update.py --all --rank

      - name: 產生網頁
        run: python build_site.py --repo "${{ github.repository }}"

      - name: 存回資料庫（data 分支只保留最新一份）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/dbsave && gzip -c market.db > /tmp/dbsave/market.db.gz && (cp calib.json /tmp/dbsave/ 2>/dev/null || true)
          ls -la /tmp/dbsave
          git branch -D data-snapshot 2>/dev/null || true
          git checkout -q --orphan data-snapshot
          git rm -rq --cached . || true
          cp /tmp/dbsave/* .
          git add -f market.db.gz $(ls calib.json 2>/dev/null)
          git commit -qm "資料庫 $(date '+%Y-%m-%d %H:%M')"
          git push -qf origin data-snapshot:data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
